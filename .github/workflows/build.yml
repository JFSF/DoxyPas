name: build

# Delphi is commercial software: GitHub's hosted runners do not have it. The Delphi jobs run on a self-hosted
# Windows runner that has RAD Studio 13 installed (labels: self-hosted, windows, delphi13); see docs/CI.md.
# Pull requests from forks are NOT run on that machine (they would execute foreign code on it).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    # runs everywhere, no Delphi needed: the links of the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/docs/check_links.py

  delphi:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, delphi13]
    steps:
      - uses: actions/checkout@v4
      - name: Build (Win32, Win64, Linux64 if the SDK is registered, GUI)
        shell: cmd
        run: build.bat
      - name: Tests (Win32, Win64)
        shell: cmd
        run: build.bat test
      - name: Release zip
        shell: pwsh
        run: tools/release/make_zip.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DoxyPas-zip
          path: build/release/*.zip
